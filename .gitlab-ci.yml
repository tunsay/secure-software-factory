# Équivalent GitLab CI de .github/workflows/ci.yml — maintenu en parallèle.
# GitLab CI est le dénominateur commun des offres DevSecOps IDF (7/10).
stages: [secrets, sast, build, scan]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

gitleaks:
  stage: secrets
  image: zricethezav/gitleaks:latest
  script: gitleaks detect --source . --no-banner --redact

api:
  stage: sast
  # Même image que la production (app/api/Dockerfile), épinglée par digest. Jusqu'au jalon 4b, ce
  # miroir tournait en Python 3.12 quand GitHub et l'image étaient en 3.14.
  image: python:3.14-slim@sha256:0741d101873c12ab927e6f8653feb8862b9bd58771177acb1b885b95141f91b4
  cache: { key: pip, paths: [.cache/pip] }
  script:
    - python scripts/check-exceptions.py # dérogations : aucune expirée (l'image gitleaks n'a pas Python)
    - cd app/api
    - pip install --require-hashes -r requirements.txt && pip install -r requirements-dev.txt
    - ruff check . && ruff format --check .
    - bandit -q -r app -c pyproject.toml
    - pip-audit -r requirements.txt --require-hashes --disable-pip --strict
    - python -m pytest -q

web:
  stage: sast
  image: node:24-alpine
  cache: { key: npm, paths: [.cache/npm] }
  script:
    - cd app/web
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm audit --audit-level=high
    - npm run build

iac:
  stage: sast
  image: hashicorp/terraform:1.16.2
  script:
    - terraform fmt -check -recursive -diff infra/terraform
    - for d in cluster platform modules/namespace; do (cd infra/terraform/$d && terraform init -backend=false -input=false >/dev/null && terraform validate) || exit 1; done

chart:
  stage: sast
  image: { name: alpine/helm:3.22.0, entrypoint: [""] }
  script:
    - V=infra/terraform/platform/dev.tfvars
    - TAG=$(sed -n 's/^image_tag *= *"\(.*\)"/\1/p' "$V")
    - API=$(sed -n 's/^ *api *= *"\(sha256:[0-9a-f]*\)".*/\1/p' "$V")
    - WEB=$(sed -n 's/^ *web *= *"\(sha256:[0-9a-f]*\)".*/\1/p' "$V")
    - SET="image.tag=$TAG,image.digests.api=$API,image.digests.web=$WEB"
    - helm lint k8s/chart --strict --set "$SET"
    - helm template ssf k8s/chart --set "$SET" > /dev/null
    - helm lint k8s/policies --strict
    - helm template ssf-policies k8s/policies > /dev/null

checkov:
  stage: sast
  image: bridgecrew/checkov:latest
  script:
    - checkov -d infra/terraform --framework terraform --quiet --compact -o cli -o gitlab_sast --output-file-path console,checkov-gl-sast.json
  artifacts:
    reports: { sast: checkov-gl-sast.json }

semgrep:
  stage: sast
  image: semgrep/semgrep
  script: semgrep scan --config p/owasp-top-ten --config p/secrets --error --gitlab-sast --output gl-sast-report.json
  artifacts:
    reports: { sast: gl-sast-report.json }

.build_scan:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  # needs court-circuite l'ordre des stages : lister TOUS les contrôles, pas seulement le code
  # applicatif (journal jalon 3, incident I7).
  needs: [gitleaks, api, web, iac, chart, checkov, semgrep]
  script:
    - docker build -t ssf-$SVC:$CI_COMMIT_SHORT_SHA app/$SVC
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0
        image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ssf-$SVC:$CI_COMMIT_SHORT_SHA

build_api:
  extends: .build_scan
  variables: { SVC: api }

build_web:
  extends: .build_scan
  variables: { SVC: web }
