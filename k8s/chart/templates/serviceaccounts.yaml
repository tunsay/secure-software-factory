# Un compte de service par composant, sans jeton monté (jalon 3b).
# Ni web ni api ne parlent à l'API Kubernetes : ils n'ont besoin d'aucune identité dans le
# cluster. Un compte dédié plutôt que « default » : si un jour l'un d'eux reçoit un droit, il
# ne sera pas partagé par tous les pods du namespace.
{{- range $component := list "api" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component }}
  labels:
    {{- include "ssf.labels" (list $ $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
