# Front React servi par nginx-unprivileged. Seul composant exposé par l'Ingress.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "ssf.labels" (list . "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ssf.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "ssf.labels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "ssf.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ssf.labels" (list . "web") | nindent 8 }}
    spec:
      enableServiceLinks: false
      # Une réplique par worker si possible : la perte d'un nœud ne coupe pas le front.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ssf.selectorLabels" (list . "web") | nindent 14 }}
      securityContext:
        {{- include "ssf.podSecurityContext" .Values.web.uid | nindent 8 }}
      containers:
        - name: web
          image: {{ include "ssf.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          securityContext:
            {{- include "ssf.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # nginx écrit son PID et ses fichiers temporaires : mêmes emplacements que les tmpfs
          # de docker-compose.yml. Tout le reste de l'image est en lecture seule.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: cache, emptyDir: { medium: Memory, sizeLimit: 32Mi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
