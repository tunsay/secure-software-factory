# En-têtes de sécurité, inclus dans CHAQUE bloc de nginx.conf qui ajoute ses propres en-têtes.
# nginx n'hérite des add_header du niveau supérieur que si le bloc n'en déclare aucun : un seul
# add_header dans un location les supprimait tous pour ce bloc (trouvé par ZAP, jalon 6a).
# always : aussi sur les réponses d'erreur.

# Aucun script inline, aucune origine externe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Isolation entre origines (défense contre les attaques de type Spectre) : le site ne charge
# rien d'une autre origine et ne se laisse charger par aucune.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
