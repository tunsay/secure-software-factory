# nginx-unprivileged : écoute sur 8080, tourne en UID 101, pas de root.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de durcissement : voir security-headers.conf, à inclure aussi dans tout bloc qui
    # déclare ses propres add_header (piège d'héritage de nginx, jalon 6a).
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        # default_type plutôt qu'add_header Content-Type : un add_header ici supprimerait les
        # en-têtes de sécurité de ce bloc.
        default_type text/plain;
        return 200 "ok";
    }

    # Interfaces internes de l'API, jamais servies au public (jalon 6a) : métriques Prometheus
    # (lues dans le cluster, directement sur api:8000), description OpenAPI, interface Swagger.
    location ~ ^/api/(metrics|openapi\.json|docs|redoc)(/|$) {
        return 404;
    }

    # Proxy vers l'API : le navigateur ne parle qu'à une seule origine.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        # Valeur fixe : ne jamais relayer l'en-tête Host du client, qu'il contrôle.
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Une seule page, sans routage côté client : une adresse inconnue est une vraie 404, pas la
    # page d'accueil servie en 200 (ZAP voyait robots.txt et sitemap.xml répondre 200).
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
