# Installation : pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Sans default_stages, chaque hook tournait deux fois par commit (pre-commit, puis commit-msg).
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^app/api/
      - id: ruff-format
        files: ^app/api/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Les templates Helm ne sont pas du YAML ({{- ... }}) : validés par le hook chart-lint.
        exclude: ^k8s/(chart|policies)/templates/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Chart de l'app : helm lint, rendu et trivy, uniquement quand un fichier du chart change.
  - repo: local
    hooks:
      - id: chart-lint
        name: chart-lint (helm lint + rendu + trivy)
        entry: make chart-lint
        language: system
        files: ^k8s/
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, chore, ci, refactor, test, sec, infra]
