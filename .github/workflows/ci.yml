# Pipeline de référence — version semaine 1.
# Étages : secrets → lint/SAST → SCA → tests → build → scan image.
# S4 ajoutera : Checkov (IaC), SBOM Syft, signature Cosign, épinglage des actions par SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # upload SARIF vers l'onglet Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: api · lint / SAST / SCA / tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: pip, cache-dependency-path: app/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: bandit (SAST)
        run: bandit -q -r app -c pyproject.toml
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt --strict
      - name: pytest
        run: python -m pytest -q

  web:
    name: web · lint / SAST / SCA / build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: app/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: eslint + tsc (SAST)
        run: npm run lint
      - name: npm audit (SCA)
        run: npm audit --audit-level=high
      - run: npm run build

  semgrep:
    name: semgrep (SAST multi-langage)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with: { sarif_file: semgrep.sarif }

  images:
    name: build + trivy · ${{ matrix.svc }}
    needs: [api, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app/${{ matrix.svc }}
          load: true
          tags: ssf-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (l'image démarre, répond, tourne sans root)
        run: |
          set -euo pipefail
          IMG=ssf-${{ matrix.svc }}:${{ github.sha }}
          if [ "${{ matrix.svc }}" = api ]; then PORT=8000; PATH_=/health; UID_=10001; else PORT=8080; PATH_=/healthz; UID_=101; fi
          # Le front proxifie /api vers un hôte "api" : on le résout vers un stub pour que nginx démarre.
          docker run -d --name smoke --add-host api:127.0.0.1 -p $PORT:$PORT "$IMG"
          for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:$PORT$PATH_" && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$PORT$PATH_"
          test "$(docker exec smoke id -u)" = "$UID_"
          docker rm -f smoke
      - name: trivy (bloquant sur HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ssf-${{ matrix.svc }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.svc }}.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-${{ matrix.svc }}.sarif
          category: trivy-${{ matrix.svc }}
