# Pipeline de référence.
# Étages : secrets → lint/SAST → SCA → IaC → tests → build → scan image → publication de l'image
# scannée → SBOM → signature et attestation → vérification (jalon 4).
#
# Machines figées en ubuntu-24.04, jamais ubuntu-latest : même logique que les actions épinglées
# par SHA. ubuntu-latest bascule vers Ubuntu 26.04 entre le 19/10 et le 19/11/2026 ; une montée
# de version du système de la CI doit être un commit choisi et vérifié, pas une surprise.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # upload SARIF vers l'onglet Security
  packages: write        # push des images vers ghcr.io (sur main uniquement)
  id-token: write        # token OIDC — Cosign keyless (jalon 4)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: api · lint / SAST / SCA / tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: pip, cache-dependency-path: app/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: bandit (SAST)
        run: bandit -q -r app -c pyproject.toml
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt --strict
      - name: pytest
        run: python -m pytest -q

  web:
    name: web · lint / SAST / SCA / build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: app/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: eslint + tsc (SAST)
        run: npm run lint
      - name: npm audit (SCA)
        run: npm audit --audit-level=high
      - run: npm run build

  semgrep:
    name: semgrep (SAST multi-langage)
    runs-on: ubuntu-24.04
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with: { sarif_file: semgrep.sarif }

  iac:
    name: terraform + chart · fmt / validate / checkov / helm lint / trivy config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.16.2", terraform_wrapper: false }
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform validate
        run: |
          for d in cluster platform modules/namespace; do
            echo "== $d"
            (cd infra/terraform/$d && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
      - name: checkov (IaC) — même image que `make infra-lint`
        run: |
          # Avec une seule sortie fichier, le second chemin EST le fichier (pas un dossier).
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov \
            -d infra/terraform --framework terraform --quiet --compact \
            -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }
      - name: trivy config (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
      # Chart de l'app : même contrôle que `make chart-lint`, rendu avec la version déployée.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.22.0 }
      - name: helm lint + rendu du chart
        run: |
          V=infra/terraform/platform/dev.tfvars
          TAG=$(sed -n 's/^image_tag *= *"\(.*\)"/\1/p' "$V")
          API=$(sed -n 's/^ *api *= *"\(sha256:[0-9a-f]*\)".*/\1/p' "$V")
          WEB=$(sed -n 's/^ *web *= *"\(sha256:[0-9a-f]*\)".*/\1/p' "$V")
          SET="image.tag=$TAG,image.digests.api=$API,image.digests.web=$WEB"
          helm lint k8s/chart --strict --set "$SET"
          mkdir -p rendered
          helm template ssf k8s/chart --set "$SET" > rendered/ssf.yaml
      - name: trivy config (manifests Kubernetes rendus)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          severity: HIGH,CRITICAL
          exit-code: "1"

  images:
    name: build + trivy · ${{ matrix.svc }}
    # Tous les contrôles, pas seulement ceux du code applicatif : ce job publie sur GHCR.
    # Jusqu'au jalon 3, seuls api et web étaient requis, et une image a été publiée alors que
    # semgrep échouait (journal jalon 3, incident I7).
    needs: [secrets, api, web, semgrep, iac]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        svc: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app/${{ matrix.svc }}
          load: true
          tags: ssf-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (l'image démarre, répond, tourne sans root)
        run: |
          set -euo pipefail
          IMG=ssf-${{ matrix.svc }}:${{ github.sha }}
          if [ "${{ matrix.svc }}" = api ]; then PORT=8000; PATH_=/health; UID_=10001; else PORT=8080; PATH_=/healthz; UID_=101; fi
          # Le front proxifie /api vers un hôte "api" : on le résout vers un stub pour que nginx démarre.
          docker run -d --name smoke --add-host api:127.0.0.1 -p $PORT:$PORT "$IMG"
          for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:$PORT$PATH_" && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$PORT$PATH_"
          test "$(docker exec smoke id -u)" = "$UID_"
          docker rm -f smoke
      - name: trivy (bloquant sur HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ssf-${{ matrix.svc }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.svc }}.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-${{ matrix.svc }}.sarif
          category: trivy-${{ matrix.svc }}

      # --- Publication vers GHCR, sur main uniquement, après tous les contrôles -------------
      # Authentification par le GITHUB_TOKEN du job : aucun secret créé ni stocké (ADR 0004).
      - name: login ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On publie l'image chargée, celle que le smoke test et Trivy viennent de contrôler, sans la
      # reconstruire. Jusqu'au jalon 3, une seconde construction (depuis le cache) était publiée :
      # ce qui était scanné et ce qui partait au registre étaient deux constructions distinctes.
      - name: publier l'image scannée (tag = SHA du commit, jamais latest)
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          LOCAL: ssf-${{ matrix.svc }}:${{ github.sha }}
          REPO: ghcr.io/${{ github.repository_owner }}/ssf-${{ matrix.svc }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL" "$REPO:$TAG"
          docker push "$REPO:$TAG"
          DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$REPO:$TAG")"
          DIGEST="${DIGEST#*@}"
          # Preuve : la configuration de l'image publiée est celle de l'image scannée.
          test "$(docker buildx imagetools inspect --raw "$REPO@$DIGEST" | jq -r .config.digest)" \
             = "$(docker image inspect --format '{{.Id}}' "$LOCAL")"
          # ref : forme canonique (digest seul), pour signer et décrire.
          # deploy : forme lisible tag@digest, pour le déploiement (le tag y est informatif).
          echo "ref=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "deploy=$REPO:$TAG@$DIGEST" >> "$GITHUB_OUTPUT"

      # --- Chaîne d'approvisionnement (jalon 4, ADR 0010) ---------------------------------------
      - name: SBOM CycloneDX de l'image publiée (Syft)
        if: steps.publish.outcome == 'success'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.svc }}.cdx.json
          artifact-name: sbom-${{ matrix.svc }}.cdx.json
          # Délai de carence de 7 jours, comme pour Dependabot : la v1.54.0 avait 2 jours.
          syft-version: v1.52.0
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.publish.outcome == 'success'
        with: { cosign-release: v3.1.3 }

      # Signature sans clé : Fulcio délivre un certificat de quelques minutes à l'identité OIDC de
      # ce workflow (id-token: write), et la signature est inscrite au journal public Rekor.
      # Aucune clé créée, stockée, à protéger ni à faire tourner. On signe le digest, jamais le tag.
      - name: signer l'image et attester son SBOM (Cosign, sans clé)
        if: steps.publish.outcome == 'success'
        env:
          REF: ${{ steps.publish.outputs.ref }}
          SVC: ${{ matrix.svc }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "sbom-$SVC.cdx.json" "$REF"

      # Même règle que la preuve locale (make supply-chain-proof) et que Kyverno au jalon 5 :
      # signée par CE workflow, sur main, et par aucune autre identité.
      - name: vérifier signature et attestation (identité exacte)
        if: steps.publish.outcome == 'success'
        env:
          REF: ${{ steps.publish.outputs.ref }}
          DEPLOY: ${{ steps.publish.outputs.deploy }}
          SVC: ${{ matrix.svc }}
          SIGNER: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          # Référence à reporter dans infra/terraform/platform/dev.tfvars pour la déployer.
          {
            echo "### ssf-$SVC : publiée, signée, SBOM attesté"
            echo '```'
            echo "$DEPLOY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
