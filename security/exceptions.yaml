# Dérogations aux gates de sécurité.
# Chaque entrée : identifiant, outil, justification, propriétaire, date d'expiration.
# Une dérogation expirée, ou sans date, fait échouer la CI : scripts/check-exceptions.py, job
# gitleaks de ci.yml, et `make scan` (jalon 4b).
# Chaque dérogation est aussi marquée à l'endroit exact du code (commentaire nosemgrep, etc.) :
# on ne désactive jamais une règle pour tout un fichier ou tout un dossier.
exceptions:
  - id: yaml.kubernetes.security.allow-privilege-escalation.allow-privilege-escalation
    tool: semgrep
    path: security/attacks/hostpath-escape.yaml
    reason: >-
      Manifeste d'attaque pédagogique, volontairement privilégié : il sert à prouver que PSS
      restricted le refuse (make attack-escape). Le durcir annulerait la démonstration.
    owner: tunsay
    expires: 2027-03-31

  - id: generic.secrets.security.detected-etc-shadow.detected-etc-shadow
    tool: semgrep
    path: docs/rapport/02-jalon-2.md
    reason: >-
      Extrait de /etc/shadow d'un nœud kind jetable, cité comme preuve de l'évasion hostPath.
      Comptes verrouillés (*), aucun condensat de mot de passe.
    owner: tunsay
    expires: 2027-03-31

  - id: generic-api-key
    tool: gitleaks
    path: .gitleaks.toml
    reason: >-
      Les images ssf-api et ssf-web sont taguées par le SHA complet du commit : « api » suivi de
      40 caractères hexadécimaux a la forme d'une clé d'API. Exception limitée aux lignes portant
      le tag d'une de nos images (journal jalon 4, J4-I1).
    owner: tunsay
    expires: 2027-03-31

# Exemple de format :
# - id: CVE-2025-00000
#   tool: trivy
#   image: ssf-api
#   reason: "Faux positif : le binaire vulnérable n'est pas présent à l'exécution (distroless)."
#   owner: tunsay
#   expires: 2026-12-31
